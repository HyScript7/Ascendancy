 */
plugins {
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21" apply false
    id("com.gradleup.shadow") version "9.4.1"
    id("com.diffplug.spotless") version "8.0.0" apply false
}

subprojects {
    // This disgusting if statement is here to prevent the intermediary :packs and :modules being treated as a jar producing project.
    if (project.file('build.gradle').exists() || project.file('build.gradle.kts').exists()) {
        apply plugin: "java"
        apply plugin: "com.diffplug.spotless"

        // Palantir is used over google-java-format because it matches the existing
        // 4-space / 120-column style instead of reformatting the world to 2 spaces.
        spotless {
            java {
                target 'src/**/*.java'
                palantirJavaFormat()
                removeUnusedImports()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }

        def mcVersion = libs.versions.minecraft.get()
        def projectName = name.capitalize()

        ext.ascendancyVersion = "Ascendancy-${projectName}-${project.version}-MC${mcVersion}-SNAPSHOT"

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }

        repositories {
            mavenCentral()
            maven { url = "https://repo.papermc.io/repository/maven-public/" }
            maven { url = 'https://maven.citizensnpcs.co/repo' }
        }

        dependencies {
            compileOnly("org.projectlombok:lombok:1.18.42")
            annotationProcessor("org.projectlombok:lombok:1.18.42")
            // In case we ever decide to test...
            // testImplementation(libs.junit)
        }

        // javac never checks {@link} targets, so a rename can leave dangling references that compile
        // perfectly and only surface when someone finally generates docs. Running javadoc as part of
        // `check` turns that into a build failure instead of a discovery.
        tasks.withType(Javadoc).configureEach {
            options.encoding = "UTF-8"
            // Everything except the `missing` group: dangling references and malformed HTML are bugs,
            // whereas a javadoc block that is only @param/@return is a deliberate style here. Leaving
            // `missing` on would bury the real errors under ~60 warnings nobody intends to fix.
            // The second argument is the usual Gradle workaround for a flag that takes no value.
            options.addStringOption("Xdoclint:all,-missing", "-quiet")
        }

        tasks.named("check").configure {
            dependsOn tasks.named("javadoc")
        }

        // The dev-server plugin set, shared by every module that runs one. It used to be copy-pasted
        // into :core and the pack, which meant two lists of pinned CI build URLs quietly drifting
        // apart — and a dev server that disagrees with itself about which Citizens build it is
        // testing against is worse than no dev server.
        //
        // Guarded by plugins.withId rather than applied to all subprojects, so it only ever touches
        // modules that actually apply run-paper. :api has no dev server and must not grow one: it is
        // contracts only, and nothing in it should know a server exists.
        plugins.withId("xyz.jpenilla.run-paper") {
            tasks.named("runServer") {
                minecraftVersion(libs.versions.minecraft.get())
                downloadPlugins {
                    hangar("carbon", libs.versions.carbon.get())
                    url("https://download.luckperms.net/1643/bukkit/loader/LuckPerms-Bukkit-5.5.55.jar")
                    url("https://ci.citizensnpcs.co/job/Citizens2/4190/artifact/dist/target/Citizens-2.0.42-b4190.jar")
                    url("https://ci.citizensnpcs.co/job/Sentinel/534/artifact/target/Sentinel-2.9.4-SNAPSHOT-b534.jar")
                }
            }
        }

        tasks.withType(Jar).configureEach {
            archiveBaseName.set(ascendancyVersion)
            // Make jars output directly into the root projects' build/libs
            destinationDirectory = new File(rootProject.buildDir, "libs")
        }

        tasks.named("processResources") {
            inputs.property("projectVersion", project.version)
            inputs.property("mcVersion", libs.versions.minecraft.get())
            inputs.property("ascendancyVersion", ascendancyVersion)

            def projectVersion = project.version
            def ascendancyVersion = ascendancyVersion

            filesMatching("paper-plugin.yml") {
                expand(
                    projectVersion: projectVersion,
                    mcVersion: mcVersion,
                    ascendancyVersion: ascendancyVersion
                )
            }
        }
    }
}

tasks.register("clean") {
    group = "cleanup"
    description = "Deletes all jars in build/libs"

    def libsDir = file("$buildDir/libs")

    doLast {
        if (libsDir.exists()) {
            libsDir.deleteDir()
        }
    }
}
